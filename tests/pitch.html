<!doctype html>
<meta charset="utf-8">
<title>Pitch test</title>
<pre id="out">running…</pre>
<script type="module">
// Synthesises piano-like notes (several partial mixes, slight inharmonicity, decay, noise)
// and compares the app's pitch detector (YIN) with the old autocorrelation one.
// Run: chrome --headless=new --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8765/tests/pitch.html
import { detectPitch, autoCorrelate, fluxPitch } from '../app/js/input.js';
const SR = 48000, N = 2048;
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const name = m => NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const toMidi = f => f > 0 ? Math.round(69 + 12 * Math.log2(f / 440)) : null;
// partial amplitude profiles: normal, weak fundamental (small speakers), strong 3rd partial
const PROFILES = {
  normal: [1, .5, .3, .2, .12, .08, .05],
  weakFund: [.25, .8, .6, .35, .2, .1, .06],
  strong3rd: [.6, .4, 1, .3, .2, .1, .05],
};
function tone(midi, profile, t0 = 0.08, noise = 0.004) {
  const f = 440 * 2 ** ((midi - 69) / 12), x = new Float32Array(N);
  profile.forEach((a, i) => {
    const k = i + 1, fk = f * k * Math.sqrt(1 + 0.0004 * k * k), ph = Math.random() * 6.28;
    for (let n = 0; n < N; n++) { const t = t0 + n / SR; x[n] += a * 0.25 * Math.exp(-t * (1 + k)) * Math.sin(2 * Math.PI * fk * t + ph); }
  });
  for (let n = 0; n < N; n++) x[n] += (Math.random() * 2 - 1) * noise;
  return x;
}
const notes = [];
for (let m = 43; m <= 84; m++) notes.push(m); // G2 .. C6
const lines = [];
for (const [pname, prof] of Object.entries(PROFILES)) {
  let yinOk = 0, acOk = 0, yinOct = 0;
  const yinBad = [], acBad = [];
  for (const m of notes) for (let rep = 0; rep < 3; rep++) {
    const x = tone(m, prof);
    const y = toMidi(detectPitch(x, SR)), a = toMidi(autoCorrelate(x, SR));
    if (y === m) yinOk++; else if (y != null && Math.abs(y - m) === 12) yinOct++; else yinBad.push(`${name(m)}→${y == null ? '?' : name(y)}`);
    if (a === m) acOk++; else acBad.push(`${name(m)}→${a == null ? '?' : name(a)}`);
  }
  const total = notes.length * 3;
  lines.push(`${pname.padEnd(10)} YIN ${yinOk}/${total} (+${yinOct} octave) | old ${acOk}/${total}`);
  lines.push(`   YIN misses: ${[...new Set(yinBad)].slice(0, 12).join(' ') || 'none'}`);
  lines.push(`   old misses: ${[...new Set(acBad)].slice(0, 12).join(' ') || 'none'}`);
}
// Ringing: the previous note is still sounding (older, quieter) when the new one is struck.
lines.push('--- new note struck while the previous one rings');
const pairs = [[60, 67], [48, 55], [55, 60], [60, 64], [64, 67], [67, 72], [62, 67], [53, 60], [60, 72]];
for (const ring of [0.25, 0.5, 0.8]) {
  let ok = 0, okOld = 0; const bad = [];
  for (const [prev, now] of pairs) for (let rep = 0; rep < 3; rep++) {
    const a = tone(prev, PROFILES.normal, 0.6, 0), b = tone(now, PROFILES.normal, 0.06);
    const x = a.map((v, i) => v * ring * 3 + b[i]);
    const y = toMidi(detectPitch(x, SR)), o = toMidi(autoCorrelate(x, SR));
    if (y === now) ok++; else bad.push(`${name(prev)}>${name(now)}→${y == null ? '?' : name(y)}`);
    if (o === now) okOld++;
  }
  lines.push(`ringing level ${ring}: YIN ${ok}/${pairs.length * 3} | old ${okOld}/${pairs.length * 3} | YIN misses: ${[...new Set(bad)].join(' ') || 'none'}`);
}
// Flux pitch: compare the spectrum just before the strike with the one just after.
const NF = 4096;
function frame(parts) { // parts: [[midi, startOffsetSeconds(negative = struck earlier), level]]
  const x = new Float32Array(NF);
  for (const [m, t0, lvl] of parts) {
    const f = 440 * 2 ** ((m - 69) / 12);
    PROFILES.normal.forEach((a, i) => {
      const k = i + 1, fk = f * k * Math.sqrt(1 + 0.0004 * k * k), ph = (m * 7 + k) % 6;
      for (let n = 0; n < NF; n++) { const t = n / SR - t0; if (t < 0) continue; x[n] += lvl * a * 0.25 * Math.exp(-t * (1 + k)) * Math.sin(2 * Math.PI * fk * t + ph); }
    });
  }
  for (let n = 0; n < NF; n++) x[n] += (Math.random() * 2 - 1) * 0.003;
  return mags(x);
}
function mags(x) {
  const re = new Float64Array(NF), im = new Float64Array(NF);
  for (let i = 0; i < NF; i++) re[i] = x[i] * (0.42 - 0.5 * Math.cos(2 * Math.PI * i / NF) + 0.08 * Math.cos(4 * Math.PI * i / NF));
  for (let i = 1, j = 0; i < NF; i++) { let b = NF >> 1; for (; j & b; b >>= 1) j ^= b; j ^= b; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; } }
  for (let len = 2; len <= NF; len <<= 1) { const ang = -2 * Math.PI / len;
    for (let i = 0; i < NF; i += len) for (let k = 0; k < len / 2; k++) {
      const wr = Math.cos(ang * k), wi = Math.sin(ang * k), ur = re[i + k], ui = im[i + k];
      const vr = re[i + k + len / 2] * wr - im[i + k + len / 2] * wi, vi = re[i + k + len / 2] * wi + im[i + k + len / 2] * wr;
      re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi; } }
  const out = new Float32Array(NF / 2);
  for (let i = 0; i < NF / 2; i++) out[i] = Math.hypot(re[i], im[i]) / NF;
  return out;
}
lines.push('--- flux pitch (new energy only), previous note ringing');
for (const ring of [0.5, 1, 2]) {
  let ok = 0, oct = 0; const bad = [];
  for (const [prev, nowM] of pairs) {
    // "before": prev struck 0.5 s ago. "after": same, plus the new note struck 50 ms into the window
    const before = frame([[prev, -0.5, ring]]);
    const after = frame([[prev, -0.58, ring], [nowM, NF / SR - 0.05, 1]]);
    const r = fluxPitch(after, before, SR, NF);
    if (r?.midi === nowM) ok++; else if (r && Math.abs(r.midi - nowM) === 12) oct++; else bad.push(`${name(prev)}>${name(nowM)}→${r ? name(r.midi) : '?'}`);
  }
  lines.push(`ringing x${ring}: flux ${ok}/${pairs.length} (+${oct} octave) | misses: ${bad.join(' ') || 'none'}`);
}
// and from silence, across the range
let okS = 0, octS = 0; const badS = [];
for (let m = 43; m <= 84; m++) {
  const r = fluxPitch(frame([[m, NF / SR - 0.05, 1]]), frame([]), SR, NF);
  if (r?.midi === m) okS++; else if (r && Math.abs(r.midi - m) === 12) octS++; else badS.push(`${name(m)}→${r ? name(r.midi) : '?'}`);
}
lines.push(`from silence G2..C6: flux ${okS}/42 (+${octS} octave) | misses: ${badS.join(' ') || 'none'}`);
document.getElementById('out').textContent = lines.join('\n');
</script>
